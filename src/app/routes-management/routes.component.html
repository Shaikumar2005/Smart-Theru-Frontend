<div class="table-card">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Route Name</th>
        <th>Total Points</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of routes">
        <td>{{ r.id }}</td>
        <td>{{ r.name }}</td>
        <td>{{ r.totalPoints }}</td>
        <td>
          <button class="edit">Edit</button>
          <button class="delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
